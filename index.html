<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>集結時刻計算ツール</title>
    <style>
        body { font-family: sans-serif; padding: 15px; font-size: 16px; max-width: 600px; margin: auto; }
        .row { display: flex; align-items: center; margin-bottom: 12px; }
        input { padding: 12px; margin: 0 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        .name { flex: 2; width: 40%; }
        .min { flex: 1; width: 20%; }
        .sec { flex: 1; width: 25%; }
        .unit { margin-right: 5px; font-size: 14px; white-space: nowrap; }
        .setting-box { background: #f1f3f5; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        
        /* トグルスイッチのスタイル（計算モード切替用） */
        .mode-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid #dcdcdc; }
        .toggle-container { display: flex; align-items: center; gap: 10px; }
        .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #007bff; transition: .3s; border-radius: 28px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #17a2b8; }
        input:checked + .slider:before { transform: translateX(24px); }
        .mode-text { font-weight: bold; font-size: 15px; color: #333; }

        .setting-row { display: flex; align-items: center; margin-bottom: 10px; font-weight: bold; flex-wrap: wrap; gap: 10px; }
        .num-input { width: 90px; text-align: center; font-weight: bold; }
        .target-input { width: 140px; text-align: center; font-weight: bold; letter-spacing: 2px; }
        
        .mode-inputs { display: none; flex-direction: column; gap: 10px; }
        .mode-inputs.active { display: flex; }

        /* 追加ボタンとチェックボックスの横並びエリア */
        .action-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .input-toggle-area { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .input-toggle-area input[type="checkbox"] { width: 18px; height: 18px; margin: 0; cursor: pointer; }

        button { width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 8px; margin-top: 10px; color: white; cursor: pointer; }
        .btn-calc { background: #007bff; }
        .btn-copy-target { background: #17a2b8; }
        .btn-copy-members { background: #28a745; }
        .btn-add { background: #6c757d; font-size: 14px; padding: 10px; width: auto; margin: 0; }
        #output { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #dee2e6; white-space: pre-wrap; min-height: 50px; }
    </style>
</head>
<body>

    <h3>集結時刻計算ツール</h3>
    <hr>
    
    <div class="setting-box">
        <!-- モード切替トグル -->
        <div class="mode-toggle-row">
            <span class="mode-text" id="modeTitle">計算モード: 現在時刻から計算</span>
            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="modeToggle" onchange="toggleMode()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- 現在時刻から計算モード用の入力群 -->
        <div id="forwardInputs" class="mode-inputs active">
            <div class="setting-row">
                インターバル時間: <input type="number" id="intervalSec" class="num-input" value="45" onfocus="this.select();"> 秒
            </div>
            <div class="setting-row">
                集結時間: <input type="number" id="forwardRallyMin" class="num-input" value="5" onfocus="this.select();"> 分
            </div>
        </div>

        <!-- 逆算モード用の入力群 -->
        <div id="backwardInputs" class="mode-inputs">
            <div class="setting-row">
                着弾時刻 (UTC 6桁): <input type="text" id="targetTimeInput" class="target-input" placeholder="例: 123456" maxlength="6" onfocus="this.select();">
            </div>
            <div class="setting-row">
                集結時間: <input type="number" id="backwardRallyMin" class="num-input" value="5" onfocus="this.select();"> 分
            </div>
        </div>
    </div>
    <hr>
    
    <!-- メンバー追加ボタン ＆ 分秒切替チェックボックス（右端） -->
    <div class="action-bar">
        <button class="btn-add" onclick="addRow()">＋ メンバー行を追加</button>
        <label class="input-toggle-area">
            <input type="checkbox" id="useMinSec" onchange="updateInputMode()"> 分＋秒で入力する
        </label>
    </div>
    
    <div id="inputRows"></div>
    
    <button class="btn-calc" onclick="calculate()">一括計算する</button>
    <div id="output"></div>
    
    <button class="btn-copy-members" onclick="copyMembersOnly()">メンバーの時間をコピー</button>
    <button class="btn-copy-target" onclick="copyTargetOnly()">着弾時刻をコピー</button>
    
    <script>
        function addRow(name = "", min = "", sec = "") {
            const container = document.getElementById('inputRows');
            const index = container.children.length + 1;
            const useMinSec = document.getElementById('useMinSec').checked;
            const div = document.createElement('div');
            div.className = 'row';
            
            if (useMinSec) {
                div.innerHTML = `
                    <input type="text" class="name" placeholder="名前 ${index}" value="${name}" onfocus="this.select();">
                    <input type="number" class="min" value="${min}" placeholder="分" onfocus="this.select();"><span class="unit">分</span>
                    <input type="number" class="sec" value="${sec}" placeholder="秒" onfocus="this.select();"><span class="unit">秒</span>
                `;
            } else {
                div.innerHTML = `
                    <input type="text" class="name" placeholder="名前 ${index}" value="${name}" onfocus="this.select();">
                    <input type="number" class="sec" value="${sec}" placeholder="秒" onfocus="this.select();"><span class="unit">秒</span>
                `;
            }
            container.appendChild(div);
        }

        // トグルスイッチによるモード切替
        function toggleMode() {
            const isBackward = document.getElementById('modeToggle').checked;
            const forwardInputs = document.getElementById('forwardInputs');
            const backwardInputs = document.getElementById('backwardInputs');
            const modeTitle = document.getElementById('modeTitle');

            if (isBackward) {
                modeTitle.innerText = "計算モード: 着弾時間を指定して逆算";
                forwardInputs.classList.remove('active');
                backwardInputs.classList.add('active');
            } else {
                modeTitle.innerText = "計算モード: 現在時刻から計算";
                backwardInputs.classList.remove('active');
                forwardInputs.classList.add('active');
            }
        }

        // 入力モード切替時に既存の入力を保持したままレイアウトを更新
        function updateInputMode() {
            const container = document.getElementById('inputRows');
            const rows = container.children;
            let currentData = [];
            
            for(let i = 0; i < rows.length; i++) {
                const nameInput = rows[i].querySelector('.name');
                const minInput = rows[i].querySelector('.min');
                const secInput = rows[i].querySelector('.sec');
                
                let m = minInput ? minInput.value : "";
                let s = secInput ? secInput.value : "";
                
                if (!document.getElementById('useMinSec').checked && m !== "" && !isNaN(m)) {
                    let total = (parseInt(m) * 60) + (s !== "" && !isNaN(s) ? parseInt(s) : 0);
                    s = total;
                    m = "";
                }

                currentData.push({
                    name: nameInput ? nameInput.value : "",
                    min: m,
                    sec: s
                });
            }
            
            container.innerHTML = "";
            const useMinSec = document.getElementById('useMinSec').checked;
            
            currentData.forEach((data, index) => {
                const div = document.createElement('div');
                div.className = 'row';
                if (useMinSec) {
                    div.innerHTML = `
                        <input type="text" class="name" placeholder="名前 ${index + 1}" value="${data.name}" onfocus="this.select();">
                        <input type="number" class="min" value="${data.min}" placeholder="分" onfocus="this.select();"><span class="unit">分</span>
                        <input type="number" class="sec" value="${data.sec}" placeholder="秒" onfocus="this.select();"><span class="unit">秒</span>
                    `;
                } else {
                    div.innerHTML = `
                        <input type="text" class="name" placeholder="名前 ${index + 1}" value="${data.name}" onfocus="this.select();">
                        <input type="number" class="sec" value="${data.sec}" placeholder="秒" onfocus="this.select();"><span class="unit">秒</span>
                    `;
                }
                container.appendChild(div);
            });
        }

        window.onload = function() {
            addRow("", "", "");
            addRow("", "", "");
            addRow("", "", "");
            addRow("", "", "");
            addRow("", "", "");
            toggleMode();
        };

        function getCalculationData() {
            const now = new Date();
            const isBackward = document.getElementById('modeToggle').checked;
            const useMinSec = document.getElementById('useMinSec').checked;

            const names = document.querySelectorAll('.name');
            const secs = document.querySelectorAll('.sec');
            const mins = document.querySelectorAll('.min');
            
            let validEntries = [];
            for(let i = 0; i < names.length; i++) {
                if(names[i].value.trim() !== "") {
                    let totalSec = 0;
                    if (useMinSec && mins[i]) {
                        const mVal = mins[i].value === "" ? 0 : parseInt(mins[i].value) || 0;
                        const sVal = secs[i].value === "" ? 0 : parseInt(secs[i].value) || 0;
                        totalSec = (mVal * 60) + sVal;
                    } else {
                        totalSec = secs[i].value === "" ? 0 : parseInt(secs[i].value) || 0;
                    }

                    validEntries.push({
                        name: names[i].value.trim(),
                        sec: totalSec
                    });
                }
            }

            if (validEntries.length === 0) {
                alert("名前を入力してください。");
                return null;
            }

            let maxSec = validEntries[0].sec;
            for(let i = 1; i < validEntries.length; i++) {
                if(validEntries[i].sec > maxSec) {
                    maxSec = validEntries[i].sec;
                }
            }

            let baseDate;
            let intervalVal = 0;
            let rallyMinVal = 5;

            if (!isBackward) {
                // 現在時刻基準（順算）
                baseDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), now.getUTCMinutes(), now.getUTCSeconds()));
                intervalVal = parseInt(document.getElementById('intervalSec').value) || 0;
                rallyMinVal = parseInt(document.getElementById('forwardRallyMin').value) || 0;
            } else {
                // 着弾時間指定基準（逆算・インターバルは0）
                const targetStr = document.getElementById('targetTimeInput').value.trim();
                if (!/^\d{6}$/.test(targetStr)) {
                    alert("着弾時刻をUTC 6桁（例: 123456）で正しく入力してください。");
                    return null;
                }

                const tHour = parseInt(targetStr.substring(0, 2), 10);
                const tMin = parseInt(targetStr.substring(2, 4), 10);
                const tSec = parseInt(targetStr.substring(4, 6), 10);

                if (tHour > 23 || tMin > 59 || tSec > 59) {
                    alert("有効なUTC時刻（時:00-23, 分・秒:00-59）を入力してください。");
                    return null;
                }

                rallyMinVal = parseInt(document.getElementById('backwardRallyMin').value) || 0;

                const targetDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), tHour, tMin, tSec));
                
                const offsetMs = (maxSec + (rallyMinVal * 60)) * 1000;
                baseDate = new Date(targetDate.getTime() - offsetMs);
            }

            const f = (n) => String(n).padStart(2, '0');

            const currentRallyMs = rallyMinVal * 60 * 1000;
            const finalBaseDate = new Date(baseDate.getTime() + (maxSec * 1000) + (intervalVal * 1000) + currentRallyMs);
            const targetText = `着弾時刻: ${f(finalBaseDate.getUTCHours())}${f(finalBaseDate.getUTCMinutes())}${f(finalBaseDate.getUTCSeconds())}`;

            let memberLines = [];
            for(let i = 0; i < validEntries.length; i++) {
                const entry = validEntries[i];
                const diffS = maxSec - entry.sec;
                const newDate = new Date(baseDate.getTime() + (diffS * 1000) + (intervalVal * 1000));
                memberLines.push(`${entry.name} ${f(newDate.getUTCHours())}${f(newDate.getUTCMinutes())}${f(newDate.getUTCSeconds())}`);
            }

            return {
                targetText: targetText,
                membersText: memberLines.join('\n'),
                fullText: memberLines.join('\n') + "\n\n" + targetText
            };
        }

        function calculate() {
            const data = getCalculationData();
            if (data !== null) {
                document.getElementById('output').innerText = data.fullText;
            }
        }

        function copyTargetOnly() {
            const data = getCalculationData();
            if (data !== null) {
                navigator.clipboard.writeText(data.targetText).then(() => alert("着弾時刻をコピーしました"));
            }
        }

        function copyMembersOnly() {
            const data = getCalculationData();
            if (data !== null) {
                navigator.clipboard.writeText(data.membersText).then(() => alert("メンバーの時間をコピーしました"));
            }
        }
    </script>
</body>
</html>
