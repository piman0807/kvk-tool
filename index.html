<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kvk用集結時刻計算ツール</title>
    <style>
        body { font-family: sans-serif; padding: 15px; font-size: 16px; max-width: 600px; margin: auto; }
        .row { display: flex; align-items: center; margin-bottom: 12px; }
        input { padding: 12px; margin: 0 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        .name { flex: 2; width: 40%; }
        .min { flex: 1; width: 20%; }
        .sec { flex: 1; width: 25%; }
        .unit { margin-right: 5px; font-size: 14px; white-space: nowrap; }
        .interval-row { display: flex; align-items: center; margin-bottom: 15px; font-weight: bold; flex-wrap: wrap; gap: 10px; }
        .interval-sec { width: 30%; }
        button { width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 8px; margin-top: 10px; color: white; cursor: pointer; }
        .btn-calc { background: #007bff; }
        .btn-copy-target { background: #17a2b8; }
        .btn-copy-members { background: #28a745; }
        .btn-add { background: #6c757d; font-size: 14px; padding: 10px; width: auto; margin-bottom: 15px; }
        #output { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #dee2e6; white-space: pre-wrap; min-height: 50px; }
    </style>
</head>
<body>

    <h3>kvk用集結時刻計算ツール</h3>
    <hr>
    
    <div class="interval-row">
        <div>インターバル時間: <input type="number" id="intervalSec" class="interval-sec" value="45" onfocus="this.select();"> 秒</div>
        <div style="font-weight: normal; font-size: 14px; margin-left: auto;">
            <label><input type="checkbox" id="useMinSec" onchange="updateInputMode()"> 分＋秒で入力する</label>
        </div>
    </div>
    <hr>
    
    <button class="btn-add" onclick="addRow()">＋ メンバー行を追加</button>
    
    <div id="inputRows"></div>
    
    <button class="btn-calc" onclick="calculate()">一括計算する</button>
    <div id="output"></div>
    
    <button class="btn-copy-members" onclick="copyMembersOnly()">メンバーの時間をコピー</button>
    <button class="btn-copy-target" onclick="copyTargetOnly()">着弾時刻をコピー</button>
    
    <script>
        function addRow(name = "", min = "", sec = "") {
            const container = document.getElementById('inputRows');
            const index = container.children.length + 1;
            const useMinSec = document.getElementById('useMinSec').checked;
            const div = document.createElement('div');
            div.className = 'row';
            
            if (useMinSec) {
                div.innerHTML = `
                    <input type="text" class="name" placeholder="名前 ${index}" value="${name}" onfocus="this.select();">
                    <input type="number" class="min" value="${min}" placeholder="分" onfocus="this.select();"><span class="unit">分</span>
                    <input type="number" class="sec" value="${sec}" placeholder="秒" onfocus="this.select();"><span class="unit">秒</span>
                `;
            } else {
                div.innerHTML = `
                    <input type="text" class="name" placeholder="名前 ${index}" value="${name}" onfocus="this.select();">
                    <input type="number" class="sec" value="${sec}" placeholder="秒" onfocus="this.select();"><span class="unit">秒</span>
                `;
            }
            container.appendChild(div);
        }

        // モード切替時に既存の入力を保持したまま入力欄のレイアウトを更新
        function updateInputMode() {
            const container = document.getElementById('inputRows');
            const rows = container.children;
            let currentData = [];
            
            for(let i = 0; i < rows.length; i++) {
                const nameInput = rows[i].querySelector('.name');
                const minInput = rows[i].querySelector('.min');
                const secInput = rows[i].querySelector('.sec');
                
                let m = minInput ? minInput.value : "";
                let s = secInput ? secInput.value : "";
                
                // 秒のみモードに切り替える際、もし分が入っていれば合計秒数に変換して保持する
                if (!document.getElementById('useMinSec').checked && m !== "" && !isNaN(m)) {
                    let total = (parseInt(m) * 60) + (s !== "" && !isNaN(s) ? parseInt(s) : 0);
                    s = total;
                    m = "";
                }

                currentData.push({
                    name: nameInput ? nameInput.value : "",
                    min: m,
                    sec: s
                });
            }
            
            container.innerHTML = "";
            const useMinSec = document.getElementById('useMinSec').checked;
            
            currentData.forEach((data, index) => {
                const div = document.createElement('div');
                div.className = 'row';
                if (useMinSec) {
                    div.innerHTML = `
                        <input type="text" class="name" placeholder="名前 ${index + 1}" value="${data.name}" onfocus="this.select();">
                        <input type="number" class="min" value="${data.min}" placeholder="分" onfocus="this.select();"><span class="unit">分</span>
                        <input type="number" class="sec" value="${data.sec}" placeholder="秒" onfocus="this.select();"><span class="unit">秒</span>
                    `;
                } else {
                    div.innerHTML = `
                        <input type="text" class="name" placeholder="名前 ${index + 1}" value="${data.name}" onfocus="this.select();">
                        <input type="number" class="sec" value="${data.sec}" placeholder="秒" onfocus="this.select();"><span class="unit">秒</span>
                    `;
                }
                container.appendChild(div);
            });
        }

        window.onload = function() {
            addRow("", "", "");
            addRow("", "", "");
            addRow("", "", "");
            addRow("", "", "");
            addRow("", "", "");
        };

        function getCalculationData() {
            const now = new Date();
            const baseDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), now.getUTCMinutes(), now.getUTCSeconds()));

            const intervalVal = parseInt(document.getElementById('intervalSec').value) || 0;
            const useMinSec = document.getElementById('useMinSec').checked;

            const names = document.querySelectorAll('.name');
            const secs = document.querySelectorAll('.sec');
            const mins = document.querySelectorAll('.min');
            
            let validEntries = [];
            for(let i = 0; i < names.length; i++) {
                if(names[i].value.trim() !== "") {
                    let totalSec = 0;
                    if (useMinSec && mins[i]) {
                        const mVal = mins[i].value === "" ? 0 : parseInt(mins[i].value) || 0;
                        const sVal = secs[i].value === "" ? 0 : parseInt(secs[i].value) || 0;
                        totalSec = (mVal * 60) + sVal;
                    } else {
                        totalSec = secs[i].value === "" ? 0 : parseInt(secs[i].value) || 0;
                    }

                    validEntries.push({
                        name: names[i].value.trim(),
                        sec: totalSec
                    });
                }
            }

            if (validEntries.length === 0) {
                alert("名前を入力してください。");
                return null;
            }

            let maxSec = validEntries[0].sec;
            for(let i = 1; i < validEntries.length; i++) {
                if(validEntries[i].sec > maxSec) {
                    maxSec = validEntries[i].sec;
                }
            }

            const f = (n) => String(n).padStart(2, '0');

            const finalBaseDate = new Date(baseDate.getTime() + (maxSec * 1000) + (intervalVal * 1000) + (5 * 60 * 1000));
            const targetText = `着弾時刻: ${f(finalBaseDate.getUTCHours())}${f(finalBaseDate.getUTCMinutes())}${f(finalBaseDate.getUTCSeconds())}`;

            let memberLines = [];
            for(let i = 0; i < validEntries.length; i++) {
                const entry = validEntries[i];
                const diffS = maxSec - entry.sec;
                const newDate = new Date(baseDate.getTime() + (diffS * 1000) + (intervalVal * 1000));
                memberLines.push(`${entry.name} ${f(newDate.getUTCHours())}${f(newDate.getUTCMinutes())}${f(newDate.getUTCSeconds())}`);
            }

            return {
                targetText: targetText,
                membersText: memberLines.join('\n'),
                fullText: memberLines.join('\n') + "\n\n" + targetText
            };
        }

        function calculate() {
            const data = getCalculationData();
            if (data !== null) {
                document.getElementById('output').innerText = data.fullText;
            }
        }

        function copyTargetOnly() {
            const data = getCalculationData();
            if (data !== null) {
                navigator.clipboard.writeText(data.targetText).then(() => alert("着弾時刻をコピーしました"));
            }
        }

        function copyMembersOnly() {
            const data = getCalculationData();
            if (data !== null) {
                navigator.clipboard.writeText(data.membersText).then(() => alert("メンバーの時間をコピーしました"));
            }
        }
    </script>
</body>
</html>
